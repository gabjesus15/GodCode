name: Security

on:
  pull_request:
    branches:
      - main
      - develop
      - "release/**"
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      - develop
      - "release/**"
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  service-role:
    name: Service Role (contrato de autorizacion)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # No necesita dependencias: el auditor solo lee ficheros con la API de Node.
      # Cada punto de entrada que importe supabaseAdmin debe declarar como
      # autoriza, y el guard declarado tiene que aparecer en cada metodo HTTP.
      - name: Auditar el uso de la Service Role Key
        run: npm run security:service-role

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # La acción falla de entrada si el repositorio tiene desactivado el grafo de
      # dependencias (Settings → Code security → Dependency graph), sin revisar
      # nada. En ese caso se avisa y se omite; al activarlo, la revisión corre sola.
      - name: Comprobar el grafo de dependencias
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Dependency Review omitido::El grafo de dependencias está desactivado. Actívalo en https://github.com/${GITHUB_REPOSITORY}/settings/security_analysis para revisar las dependencias de cada PR."
          fi

      - name: Dependency review
        if: steps.graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@v4

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
